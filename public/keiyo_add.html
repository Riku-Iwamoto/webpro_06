<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>駅の登録</title>
</head>
<body>
  <h1>駅の登録</h1>

  <form action="/keiyo_add" method="get">

  </form>
</body>
</html>
